<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Title/description/og/twitter abaixo são sobrescritos em toda requisição pelo SSR via
       SeoService (dados vêm de `configuracao_loja` no banco) — o valor aqui nunca chega a um
       usuário ou crawler real, só serve de fallback se o SSR falhar. Não precisa trocar por
       loja, mas fique livre pra ajustar se quiser um fallback mais descritivo. -->
  <title>Loja temática</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Loja temática.">
  <meta property="og:site_name" content="Loja temática">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Loja temática">
  <meta property="og:description" content="Loja temática.">
  <meta property="og:image" content="og-padrao.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Loja temática">
  <meta name="twitter:description" content="Loja temática.">
  <meta name="twitter:image" content="og-padrao.jpg">
  <!-- Abaixo: arquivos estáticos reais (ícones/manifest) — precisam existir em public/ por
       loja, não vêm do banco. Editar na hora de montar uma loja nova. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17141a">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
