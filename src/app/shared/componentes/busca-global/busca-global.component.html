@if (aberta()) {
  <div class="busca-overlay" (click)="fechar()">
    <div class="busca-painel" (click)="$event.stopPropagation()">
      <div class="busca-campo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M19.5 19.5 15 15" stroke-linecap="round" />
        </svg>
        <input
          type="text"
          placeholder="Buscar produtos..."
          [value]="termo()"
          (input)="atualizarTermo($any($event.target).value)"
          autofocus
        />
        <button type="button" class="busca-fechar" (click)="fechar()" aria-label="Fechar busca">✕</button>
      </div>

      @if (termo().trim().length > 0) {
        @if (resultados().length > 0) {
          <ul class="busca-resultados">
            @for (produto of resultados(); track produto.id) {
              <li>
                <button type="button" (click)="irParaProduto(produto.slug)">
                  <span
                    class="busca-imagem"
                    [style.backgroundImage]="'url(' + produto.imagens[0] + ')'"
                  ></span>
                  <span class="busca-info">
                    <span class="busca-nome">{{ produto.nome }}</span>
                    <span class="busca-preco">R$ {{ produto.precoBase.toFixed(2) }}</span>
                  </span>
                </button>
              </li>
            }
          </ul>
        } @else {
          <p class="busca-vazio">Nenhum produto encontrado para "{{ termo() }}".</p>
        }
      }
    </div>
  </div>
}
