<header class="cabecalho">
  <div class="cabecalho__conteudo">
    <a routerLink="/" class="cabecalho__logo">
      <span class="cabecalho__logo-marca">Nostál</span><span class="cabecalho__logo-acento">gika</span>
    </a>

    <nav class="cabecalho__navegacao">
      <a routerLink="/categoria/musica" routerLinkActive="ativo">Música</a>
      <a routerLink="/categoria/futebol" routerLinkActive="ativo">Futebol</a>
      <a routerLink="/categoria/geek" routerLinkActive="ativo">Geek</a>
      <a routerLink="/categoria/automotivo" routerLinkActive="ativo">Automotivo</a>
      <a routerLink="/categoria/cinema" routerLinkActive="ativo">Cinema</a>
      <a routerLink="/categoria/humor" routerLinkActive="ativo">Humor</a>
    </nav>

    <div class="cabecalho__acoes">
      <button
        type="button"
        class="cabecalho__icone"
        title="Buscar"
        aria-label="Buscar"
        (click)="alternarBusca()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M19.5 19.5 15 15" stroke-linecap="round" />
        </svg>
      </button>
      <a routerLink="/conta" class="cabecalho__icone" title="Minha conta" aria-label="Minha conta">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="3.6" />
          <path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6" stroke-linecap="round" />
        </svg>
      </a>
      <button type="button" class="cabecalho__icone" title="Carrinho" aria-label="Carrinho" (click)="alternarCarrinho()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3.5 6h2l1 12.2a1.8 1.8 0 0 0 1.8 1.6h8.4a1.8 1.8 0 0 0 1.8-1.6L19.5 9h-13" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="10" cy="21" r="1.2" fill="currentColor" stroke="none" />
          <circle cx="16.5" cy="21" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        @if (quantidadeTotalItens() > 0) {
          <span class="cabecalho__badge">{{ quantidadeTotalItens() }}</span>
        }
      </button>
    </div>
  </div>
</header>
