<a class="cartao-produto" [routerLink]="['/produto', produto.slug]">
  <div class="cartao-produto__imagem">
    <img class="cartao-produto__foto cartao-produto__foto--principal" [src]="imagemPrincipal()" [alt]="produto.nome" loading="lazy" />
    @if (temSegundaImagem()) {
      <img class="cartao-produto__foto cartao-produto__foto--hover" [src]="imagemHover()" [alt]="produto.nome" loading="lazy" />
    }
    <span class="cartao-produto__etiqueta">R$ {{ produto.precoBase.toFixed(2) }}</span>
    @if (esgotado()) {
      <span class="cartao-produto__esgotado">Esgotado</span>
    }
    <button
      type="button"
      class="cartao-produto__favorito"
      [class.ativo]="favoritado()"
      (click)="alternarFavorito($event)"
      [attr.aria-label]="favoritado() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      [attr.aria-pressed]="favoritado()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" [attr.fill]="favoritado() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8">
        <path d="M12 20.5s-7.5-4.6-10-9.3C.5 8 1.8 4.5 5.2 3.6c2-.5 4 .3 5.3 2.1l1.5 2 1.5-2c1.3-1.8 3.3-2.6 5.3-2.1 3.4.9 4.7 4.4 3.2 7.6-2.5 4.7-10 9.3-10 9.3z" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
  <div class="cartao-produto__info">
    <h3>{{ produto.nome }}</h3>
    <p class="cartao-produto__descricao">{{ produto.descricao }}</p>
  </div>
</a>
