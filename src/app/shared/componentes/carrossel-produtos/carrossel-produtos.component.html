<div class="carrossel-produtos">
  <div class="carrossel-produtos__linha">
    <button
      type="button"
      class="carrossel-produtos__seta carrossel-produtos__seta--anterior"
      [disabled]="paginaAtual() === 0"
      (click)="anterior()"
      aria-label="Produtos anteriores"
    >
      ‹
    </button>

    <div class="carrossel-produtos__trilho" #trilho (scroll)="onScroll()">
      @for (produto of produtos; track produto.id) {
        <div class="carrossel-produtos__item">
          <app-cartao-produto [produto]="produto" />
        </div>
      }
    </div>

    <button
      type="button"
      class="carrossel-produtos__seta carrossel-produtos__seta--proxima"
      [disabled]="paginaAtual() >= totalPaginas() - 1"
      (click)="proximo()"
      aria-label="Próximos produtos"
    >
      ›
    </button>
  </div>

  @if (totalPaginas() > 1) {
    <div class="carrossel-produtos__pontos">
      @for (pagina of paginas(); track pagina) {
        <button
          type="button"
          class="carrossel-produtos__ponto"
          [class.carrossel-produtos__ponto--ativo]="pagina === paginaAtual()"
          (click)="irParaPagina(pagina)"
          [attr.aria-label]="'Ir pra página ' + (pagina + 1)"
          [attr.aria-current]="pagina === paginaAtual() ? 'true' : null"
        ></button>
      }
    </div>
  }
</div>
