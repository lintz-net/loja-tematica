<section class="home-hero">
  <div class="container-pagina home-hero__conteudo">
    <h1>Encontre a sua tribo</h1>
    <p>Camisetas, acessórios, ímãs e lembranças para quem vive de paixões: música, futebol, geek, automotivo, cinema e humor.</p>
  </div>
</section>

<section class="container-pagina">
  <h2 class="home-titulo-secao">Escolha sua vibe</h2>

  <div class="home-grade-categorias">
    @for (categoria of categorias(); track categoria.id) {
      <a
        class="home-card-categoria tema-{{ categoria.slug }}"
        [routerLink]="['/categoria', categoria.slug]"
      >
        <span class="home-card-categoria__icone">{{ categoria.icone }}</span>
        <h3>{{ categoria.nome }}</h3>
        <p>{{ categoria.descricaoCurta }}</p>
      </a>
    }
  </div>
</section>
